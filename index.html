<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#15161a" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply saved theme before paint to avoid a flash. Defaults to dark.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme = stored === "light" || stored === "dark" ? stored : "dark";
          document.documentElement.classList.toggle("dark", theme === "dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <title>Brian Roco | Video Editor &amp; Illustrator</title>
    <meta name="description" content="Portfolio of Brian Roco, a video editor and illustrator based in Cavite, Philippines. Brand films, AI generated video, apparel graphics and print." />
    <meta name="author" content="Brian Roco" />
    <meta property="og:title" content="Brian Roco | Video Editor &amp; Illustrator" />
    <meta property="og:description" content="Brand films, AI generated video, apparel graphics and print. Based in Cavite, Philippines." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
